<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lunar Survival Academy</title>
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <div class="hud__brand">
          <p class="hud__eyebrow">Junior Astronaut Mission Trainer</p>
          <h1 class="hud__title">Lunar Survival Academy</h1>
        </div>
        <ul class="meters" aria-label="Colony resources">
          <li class="meter meter--power">
            <span class="meter__label">Power</span>
            <span class="meter__value" id="meter-power">80</span>
          </li>
          <li class="meter meter--oxygen">
            <span class="meter__label">Oxygen</span>
            <span class="meter__value" id="meter-oxygen">80</span>
          </li>
          <li class="meter meter--food">
            <span class="meter__label">Food</span>
            <span class="meter__value" id="meter-food">70</span>
          </li>
          <li class="meter meter--water">
            <span class="meter__label">Water</span>
            <span class="meter__value" id="meter-water">70</span>
          </li>
          <li class="meter meter--radiation">
            <span class="meter__label">Radiation risk</span>
            <span class="meter__value" id="meter-radiation" aria-describedby="radiation-help">10</span>
            <span id="radiation-help" class="sr-only">Higher radiation risk is more dangerous. 100 ends the mission.</span>
          </li>
        </ul>
        <div class="mission-clock" aria-label="Mission clock">
          <p class="mission-clock__item">
            <span class="mission-clock__label">Day</span>
            <strong id="mission-day">1</strong><span class="mission-clock__of"> / 5</span>
          </p>
          <p class="mission-clock__item">
            <span class="mission-clock__label">Actions</span>
            <strong id="actions-remaining">2</strong>
          </p>
        </div>
        <nav id="building-picker" class="building-picker" aria-label="Choose a building"></nav>
      </header>

      <main class="stage">
        <div id="game-container" aria-label="Lunar colony map"></div>
        <aside id="building-panel" class="building-panel" hidden></aside>
      </main>

      <footer class="mission-bar">
        <div class="mission-bar__copy">
          <p id="event-banner" class="event-banner" hidden></p>
          <p id="mission-status" class="mission-status" role="status">Mission underway.</p>
          <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
          <p class="disclaimer">Resource numbers are fictional training values.</p>
        </div>
        <div class="mission-actions">
          <button type="button" id="end-day" class="button button--primary">End Day</button>
          <button type="button" id="restart-mission" class="button button--quiet">Restart Mission</button>
        </div>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
